<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="拍下餐點照片，AI 估算熱量與蛋白質、碳水、脂肪，搭配每日目標與體重趨勢自我管理。" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-title" content="NutriLens" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <title>NutriLens AI - 多角度餐食視覺營養分析與追蹤系統</title>

  <!-- Apply the saved theme before first paint to avoid a light flash. The key must match STORAGE_KEYS.theme. -->
  <script>
    try {
      var th = localStorage.getItem('nutrilens_theme_v1') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.classList.toggle('dark', th === 'dark');
    } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

  <!-- TAILWIND:BEGIN
       Development only: the Play CDN compiles classes in the browser.
       `node build.mjs` replaces everything up to TAILWIND:END with compiled CSS,
       using the "text/tailwindcss" style block below as its input.
       Keep anything that production also needs OUTSIDE these markers. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>if (window.tailwind) tailwind.config = { darkMode: 'class' };</script>

  <!-- Component classes: named shorthands for repeated utility combinations. -->
  <style type="text/tailwindcss">
    @layer components {
      .card {
        @apply bg-white dark:bg-[#161618] rounded-2xl p-5 shadow-sm border
               border-slate-200 dark:border-[#2d2f38] transition-colors;
      }
      .panel {
        @apply bg-slate-50 dark:bg-[#1e1e22] rounded-xl border border-slate-100
               dark:border-[#2d2f38];
      }
      .field {
        @apply bg-white dark:bg-[#1e1e22] border border-slate-300 dark:border-[#2d2f38]
               rounded-lg px-2.5 py-1.5 text-sm text-slate-800 dark:text-slate-100
               focus:outline-none focus:border-emerald-500;
      }
      .btn {
        @apply inline-flex items-center justify-center gap-1.5 rounded-lg px-3 py-2
               text-sm font-medium transition active:scale-95 disabled:opacity-60
               disabled:pointer-events-none;
      }
      .btn-primary {
        @apply bg-emerald-600 hover:bg-emerald-700 text-white;
      }
      .btn-outline {
        @apply border border-slate-200 dark:border-[#2d2f38] bg-white dark:bg-[#1e1e22]
               hover:bg-slate-100 dark:hover:bg-[#2d2f38] text-slate-700
               dark:text-slate-200;
      }
      .btn-soft {
        @apply bg-slate-100 dark:bg-[#1e1e22] hover:bg-slate-200
               dark:hover:bg-[#2d2f38] text-slate-700 dark:text-slate-200 border
               border-slate-200 dark:border-[#2d2f38];
      }
      .btn-danger {
        @apply bg-rose-600 hover:bg-rose-700 text-white;
      }
      .icon-btn {
        @apply w-9 h-9 inline-flex items-center justify-center rounded-lg border
               border-slate-200 dark:border-[#2d2f38] bg-white dark:bg-[#1e1e22]
               hover:bg-slate-100 dark:hover:bg-[#2d2f38] transition active:scale-95;
      }
      .modal {
        @apply fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/70
               p-3 sm:p-4 overflow-y-auto backdrop-blur-sm;
      }
      .modal.open {
        @apply flex;
      }
      .modal-panel {
        @apply bg-white dark:bg-[#161618] text-slate-900 dark:text-slate-100
               rounded-2xl w-full p-5 sm:p-6 shadow-2xl border border-slate-200
               dark:border-[#2d2f38] my-auto space-y-4 max-h-[94vh] overflow-y-auto;
      }
      .tab-btn {
        @apply px-4 py-2 rounded-xl text-sm font-medium text-slate-600
               dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-[#1e1e22]
               transition;
      }
      .tab-btn[aria-selected="true"] {
        @apply font-bold bg-emerald-600 text-white hover:bg-emerald-600
               dark:hover:bg-emerald-600;
      }
      .range-btn {
        @apply px-2 py-0.5 rounded-md text-xs font-medium text-slate-500
               dark:text-slate-400 hover:bg-slate-200/60 dark:hover:bg-[#2d2f38]
               transition;
      }
      .menu-item {
        @apply w-full flex items-center gap-3 px-4 py-2.5 text-sm text-left
               hover:bg-slate-100 dark:hover:bg-[#2d2f38];
      }
      .range-btn[aria-pressed="true"] {
        @apply font-semibold bg-emerald-100 dark:bg-emerald-950 text-emerald-800
               dark:text-emerald-300;
      }
    }
  </style>
  <!-- TAILWIND:END -->

  <link rel="stylesheet" href="css/app.css" />
</head>

<body class="bg-slate-50 dark:bg-[#0f0f0f] text-slate-800 dark:text-slate-100 min-h-screen pb-16 antialiased">
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></symbol>

    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
    <symbol id="i-scale" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10a4 4 0 0 1 8 0"/><path d="m12 10 2-2"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></symbol>
    <symbol id="i-utensils" viewBox="0 0 24 24"><path d="M3 2v7a3 3 0 0 0 3 3v10M9 2v7a3 3 0 0 1-3 3M6 2v6"/><path d="M19 2c-2.5 1.5-4 4-4 7 0 2 1 3 3 3v10"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 8h16M4 16h16"/><circle cx="9" cy="8" r="2"/><circle cx="15" cy="16" r="2"/></symbol>

    <symbol id="i-file-up" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 18v-6M9 14l3-3 3 3"/></symbol>
    <symbol id="i-file-csv" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
    <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></symbol>

    <symbol id="i-circle-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>

    <symbol id="i-chart-pie" viewBox="0 0 24 24"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></symbol>

    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-15-6.7L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 15 6.7L21 16"/><path d="M16 16h5v5"/></symbol>
    <symbol id="i-focus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></symbol>

  <!-- One toast at a time, at the top: bottom toasts used to cover modal Save buttons -->
  <div
    id="toastContainer"
    class="fixed top-3 inset-x-4 sm:inset-x-auto sm:right-5 sm:top-5 z-[60] flex flex-col
           items-center sm:items-end pointer-events-none"
    role="status"
    aria-live="polite"></div>

  <!-- Header: one row. Everything except the date lives in the ⋯ menu (phones have little room). -->
  <header
    class="bg-white/90 dark:bg-[#161618]/90 backdrop-blur-md border-b border-slate-200
           dark:border-[#2d2f38] relative sm:sticky sm:top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 py-2.5 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 min-w-0">
        <div
          class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center
                 justify-center text-white shrink-0"
          aria-hidden="true">
          <svg class="icon" aria-hidden="true"><use href="#i-camera"/></svg>
        </div>
        <h1
          class="hidden min-[440px]:block font-bold text-base sm:text-lg leading-tight truncate"
          data-i18n="appTitle"></h1>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <div
          class="flex items-center bg-slate-100 dark:bg-[#1e1e22] rounded-lg border border-slate-200/70
                 dark:border-[#2d2f38]">
          <button
            type="button"
            data-action="date-prev"
            class="w-9 h-9 rounded-lg hover:bg-slate-200 dark:hover:bg-[#2d2f38] inline-flex items-center
                   justify-center"
            data-i18n-title="prevDay"
            aria-label="Previous day"><svg class="icon" aria-hidden="true"><use href="#i-chevron-left"/></svg></button>
          <input
            type="date"
            id="selectedDate"
            aria-label="Date"
            class="bg-transparent font-medium text-sm focus:outline-none cursor-pointer w-[7.5rem] sm:w-auto" />
          <button
            type="button"
            data-action="date-next"
            class="w-9 h-9 rounded-lg hover:bg-slate-200 dark:hover:bg-[#2d2f38] inline-flex items-center
                   justify-center"
            data-i18n-title="nextDay"
            aria-label="Next day"><svg class="icon" aria-hidden="true"><use href="#i-chevron-right"/></svg></button>
        </div>
        <div class="relative">
          <button
            type="button"
            id="menuBtn"
            data-action="toggle-menu"
            class="icon-btn w-10 h-10 relative"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="appMenu"
            data-i18n-title="menu">
            <svg class="icon" aria-hidden="true"><use href="#i-dots"/></svg>
            <span id="apiStatusDot" class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full"></span>
          </button>
          <div
            id="appMenu"
            class="hidden absolute right-0 mt-2 w-64 bg-white dark:bg-[#1e1e22] border border-slate-200
                   dark:border-[#2d2f38] rounded-xl shadow-xl py-1.5 z-40"
            role="menu">
            <button type="button" role="menuitem" data-action="open-modal" data-modal="goalModal" class="menu-item">
              <svg class="icon text-emerald-600" aria-hidden="true"><use href="#i-sliders"/></svg>
              <span data-i18n="btnGoal"></span>
            </button>
            <button type="button" role="menuitem" data-action="open-modal" data-modal="dataModal" class="menu-item">
              <svg class="icon text-amber-500" aria-hidden="true"><use href="#i-star"/></svg>
              <span data-i18n="btnDataManage"></span>
            </button>
            <button type="button" role="menuitem" data-action="open-modal" data-modal="apiModal" class="menu-item">
              <svg class="icon text-amber-500" aria-hidden="true"><use href="#i-key"/></svg>
              <span data-i18n="menuApiKey"></span>
              <span id="apiStatusText" class="ml-auto text-xs"></span>
            </button>
            <div class="my-1 border-t border-slate-100 dark:border-[#2d2f38]"></div>
            <button type="button" role="menuitem" data-action="toggle-lang" class="menu-item">
              <svg class="icon text-sky-500" aria-hidden="true"><use href="#i-globe"/></svg>
              <span data-i18n="langSwitch"></span>
              <span id="langBtnText" class="ml-auto text-xs font-bold"></span>
            </button>
            <button type="button" role="menuitem" data-action="toggle-theme" class="menu-item">
              <svg class="icon" id="themeIcon" aria-hidden="true"><use href="#i-moon"/></svg>
              <span data-i18n="themeSwitch"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Context banner: demo data / setup not finished / no API key (see BANNER_STATES) -->
  <div id="appBanner" class="hidden max-w-5xl mx-auto px-4 mt-4" role="status"></div>

  <!-- Page order follows the daily loop: where am I → log a meal → what I ate → weight -->
  <main class="max-w-5xl mx-auto px-4 mt-4 sm:mt-6 space-y-5">

    <!-- Daily overview -->
    <section class="card" aria-labelledby="dashboardTitle">
      <div class="flex items-center justify-between gap-2 mb-4">
        <h2 class="font-bold text-base" id="dashboardTitle"></h2>
        <span id="calorieStatusBadge" class="text-xs font-semibold px-2.5 py-1 rounded-full border"></span>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-12 gap-5 items-center">
        <div class="md:col-span-5 panel flex items-center justify-center gap-5 p-4">
          <div class="relative w-32 h-32 flex items-center justify-center shrink-0">
            <svg class="w-32 h-32" viewBox="0 0 128 128" aria-hidden="true">
              <circle
                class="text-slate-200 dark:text-[#2d2f38]"
                stroke-width="10"
                stroke="currentColor"
                fill="transparent"
                r="52"
                cx="64"
                cy="64" />
              <circle
                id="calRing"
                class="text-emerald-500 ring"
                stroke-width="10"
                stroke-dasharray="326.7"
                stroke-dashoffset="326.7"
                stroke-linecap="round"
                stroke="currentColor"
                fill="transparent"
                r="52"
                cx="64"
                cy="64" />
            </svg>
            <div class="absolute text-center">
              <div class="text-2xl font-extrabold mono" id="totalCalDisplay">0</div>
              <div class="text-xs text-slate-500 mono">/ <span id="goalCalDisplay">0</span> kcal</div>
            </div>
          </div>
          <div class="space-y-1 text-sm">
            <div id="remainCalLabel" class="text-slate-500 text-xs font-medium" data-i18n="remainCalLabel"></div>
            <div class="text-2xl font-extrabold tracking-tight" id="remainCalDisplay"></div>
            <div class="text-xs text-slate-500" id="mealCountDisplay"></div>
          </div>
        </div>
        <div class="md:col-span-7 space-y-4" id="macroBars"></div>
      </div>
    </section>

    <!-- Log a meal: photo → AI analysis → editable result -->
    <section class="card" aria-labelledby="uploadTitle">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
        <h2 id="uploadTitle" class="font-bold text-base" data-i18n="uploadSecTitle"></h2>
        <label class="flex items-center gap-2 text-xs">
          <span class="text-slate-500" data-i18n="mealTimeLabel"></span>
          <input type="time" id="mealTimeInput" class="field py-1" />
        </label>
      </div>

      <!-- Slot 1 is the main photo button; slots 2–3 appear once a photo is chosen -->
      <div class="grid grid-cols-2 gap-3 mb-3" id="uploadSlots"></div>

      <div class="flex flex-col sm:flex-row gap-2.5">
        <input
          type="text"
          id="mealNoteInput"
          data-i18n-placeholder="notePlaceholder"
          class="field flex-1 rounded-xl px-4 py-2.5 text-base sm:text-sm" />
        <button
          type="button"
          id="analyzeBtn"
          data-action="analyze"
          class="btn btn-primary px-6 py-3 rounded-xl font-semibold text-base sm:text-sm">
          <svg class="icon" aria-hidden="true"><use href="#i-sparkles"/></svg>
          <span data-i18n="btnAnalyze"></span>
        </button>
      </div>

      <!-- Analysis queue: one card per job (running / done / failed) -->
      <div id="jobsPanel" class="mt-3 space-y-2" aria-live="polite"></div>

      <div
        id="analysisResultBox"
        class="hidden mt-5 bg-emerald-50/50 dark:bg-emerald-950/20 border border-emerald-200/80
               dark:border-emerald-800/50 rounded-2xl p-4 sm:p-5 space-y-4">
        <div
          id="firstResultHint"
          class="hidden panel bg-sky-50 dark:bg-sky-950/40 border-sky-200 dark:border-sky-800/60 p-3
                 text-sm text-sky-900 dark:text-sky-200 flex items-start justify-between gap-3">
          <span data-i18n="firstResultHint"></span>
          <button
            type="button"
            data-action="dismiss-hint"
            class="font-semibold underline shrink-0"
            data-i18n="gotIt"></button>
        </div>
        <div>
          <span
            class="text-xs font-semibold text-emerald-800 dark:text-emerald-300 bg-emerald-200/70
                   dark:bg-emerald-900/60 px-2.5 py-0.5 rounded-full"
            id="resBadge"></span>
          <input
            type="text"
            id="resMealName"
            aria-label="Meal name"
            class="block w-full mt-1.5 font-bold text-xl bg-transparent border-b border-transparent
                   hover:border-emerald-400 focus:border-emerald-500 focus:outline-none" />
        </div>

        <!-- Portion eaten: quick choices; the slider is for fine-tuning -->
        <div class="space-y-2">
          <div class="flex items-center justify-between text-sm font-semibold">
            <span data-i18n="portionLabel"></span>
            <strong id="portionPctText" class="text-emerald-700 dark:text-emerald-400 mono">100%</strong>
          </div>
          <p class="text-xs text-slate-500 -mt-1" data-i18n="portionHint"></p>
          <div class="grid grid-cols-4 gap-2" role="group" id="portionButtons">
            <button type="button" data-action="portion" data-pct="25" class="btn btn-soft py-2">¼</button>
            <button type="button" data-action="portion" data-pct="50" class="btn btn-soft py-2">½</button>
            <button type="button" data-action="portion" data-pct="75" class="btn btn-soft py-2">¾</button>
            <button
              type="button"
              data-action="portion"
              data-pct="100"
              class="btn btn-soft py-2"

          <span id="editTotals" class="mono font-semibold"></span></div>
      </div>
      <!-- Apply-to scope: only shown when a linked favorite or identical records exist -->
      <div id="editScopeWrap" class="hidden panel p-3 space-y-2 text-sm">
        <label id="scopeFavRow" class="hidden flex items-start gap-2 cursor-pointer">
          <input type="checkbox" id="scopeFav" class="mt-1 accent-emerald-600 w-4 h-4" />
          <span id="scopeFavText"></span>
        </label>
        <label id="scopeTwinsRow" class="hidden flex items-start gap-2 cursor-pointer">
          <input type="checkbox" id="scopeTwins" class="mt-1 accent-emerald-600 w-4 h-4" />
          <span id="scopeTwinsText"></span>
        </label>
      </div>
      <div
        class="sticky bottom-0 -mx-5 sm:-mx-6 -mb-5 sm:-mb-6 px-5 sm:px-6 py-3 bg-white/95
               dark:bg-[#161618]/95 backdrop-blur border-t border-slate-200 dark:border-[#2d2f38] flex
               items-center justify-between gap-2">
        <button
          type="button"
          data-action="delete-meal-edit"
          class="btn text-sm text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/40
                 px-2">
          <svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg>
          <span data-i18n="deleteThisMeal"></span>
        </button>
        <div class="flex gap-2">
          <button type="button" data-action="close-modal" class="btn btn-soft" data-i18n="btnCancel"></button>
          <button
            type="button"
            data-action="save-meal-edit"
            class="btn btn-primary font-bold px-5"
            data-i18n="btnSave"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- First-run onboarding: welcome → key → goals → first meal (see section 10.12) -->
  <div
    id="onboarding"
    class="hidden fixed inset-0 z-[55] bg-slate-950/70 backdrop-blur-sm overflow-y-auto sm:p-4"
    role="dialog"
    aria-modal="true"
    aria-labelledby="obTitle">
    <div
      class="min-h-full sm:min-h-0 bg-white dark:bg-[#161618] text-slate-900 dark:text-slate-100
             sm:rounded-2xl sm:max-w-lg sm:mx-auto sm:my-6 p-5 sm:p-6 flex flex-col gap-4 shadow-2xl">
      <div class="flex items-center justify-between gap-3">
        <button
          type="button"
          id="obBack"
          data-action="ob-back"
          class="icon-btn invisible"
          data-i18n-title="obBack"
          aria-label="Back"><svg class="icon" aria-hidden="true"><use href="#i-chevron-left"/></svg></button>
        <div id="obDots" class="flex items-center gap-1.5"></div>
        <button
          type="button"
          data-action="ob-later"
          class="text-xs text-slate-500 dark:text-slate-400 hover:underline"
          data-i18n="obLater"></button>
      </div>
      <div id="obBody" class="flex flex-col gap-4"></div>
    </div>
  </div>

  <!-- How to get a Gemini API key (bottom sheet on phones, dialog on desktop) -->
  <div
    id="keyGuide"
    class="hidden fixed inset-0 z-[58] bg-slate-950/60 flex items-end sm:items-center justify-center
           sm:p-4"
    role="dialog"
    aria-modal="true"
    aria-labelledby="guideTitle">
    <div
      class="bg-white dark:bg-[#161618] text-slate-900 dark:text-slate-100 w-full sm:max-w-lg
             rounded-t-2xl sm:rounded-2xl p-5 sm:p-6 max-h-[90vh] overflow-y-auto space-y-4 shadow-2xl">
      <div
        class="sticky -top-5 sm:-top-6 z-10 -mx-5 sm:-mx-6 px-5 sm:px-6 py-3 bg-white dark:bg-[#161618]
               border-b border-slate-100 dark:border-[#2d2f38] flex items-center justify-between">
        <h3 id="guideTitle" tabindex="-1" class="font-bold text-lg focus:outline-none" data-i18n="guideTitle"></h3>
        <button
          type="button"
          data-action="close-guide"
          class="icon-btn"
          aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
      </div>
      <ol id="guideSteps" class="space-y-5"></ol>
      <details class="panel p-3 text-xs text-slate-600 dark:text-slate-300">
        <summary class="font-semibold flex items-center justify-between">
          <span data-i18n="guideTipsTitle"></span>
          <svg class="icon chev transition" aria-hidden="true"><use href="#i-chevron-down"/></svg>
        </summary>
        <div class="mt-2 space-y-1.5">
          <p data-i18n="guideTip1"></p>
          <p data-i18n="guideTip2"></p>
          <p data-i18n="guideTip3"></p>
          <p data-i18n="guideTip4"></p>
        </div>
      </details>
      <button
        type="button"
        data-action="close-guide"
        class="btn btn-primary w-full py-3"
        data-i18n="guideBack"></button>
    </div>
  </div>


<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
